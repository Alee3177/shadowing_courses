function renderSentence(v){
 let s=SENTENCE_MAP[v.masu];
 $("#sentences").innerHTML=`<div style="padding:6px 0"><div class="tag">目前動詞：${v.dict}（${v.kana_dict}）</div><div class="jp" style="font-size:22px">${s.ja}</div><div>${s.kana}</div><div class="romaji">${s.romaji}</div><div class="zh">${s.zh}</div><div class="row"><button class="sentence-shadow" onclick="speakSentence(this)">🔊 跟讀</button><label style="display:flex;align-items:center;gap:7px;font-weight:700">語速：<select id="sentenceSpeed" aria-label="完整句跟讀語速"><option value="1" selected>1.0x 正常</option><option value="0.7">0.7x 慢速</option></select></label></div></div>`;
}
function speakSentence(btn){if(uiLocked)return;let v=list()[idx],s=SENTENCE_MAP[v.masu],speed=parseFloat($("#sentenceSpeed")?.value||"1");speak(s.ja,speed,btn)}
render();
</script></body></html>
