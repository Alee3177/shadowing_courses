<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>にじ｜Shadowing 全曲版</title>
<style>
:root{--bg:#0f172a;--panel:#17253a;--list:#020617;--line:#334155;--blue:#38bdf8;--yellow:#facc15;--green:#86efac;--red:#fca5a5;--text:#e2e8f0;--muted:#94a3b8;--orange:#fb923c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;padding:14px}.wrap{max-width:920px;margin:auto}h1{text-align:center;font-size:24px;margin:8px 0 12px}.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:12px 0}button,select{border:0;border-radius:10px;padding:10px 14px;font-weight:700}button{background:var(--blue);color:#00121c;cursor:pointer}button.alt{background:#cbd5e1;color:#0f172a}button.stop{background:#f87171;color:#111827}select{background:#e2e8f0;color:#0f172a}.card{background:var(--panel);border:3px solid var(--blue);border-radius:20px;padding:22px;text-align:center;box-shadow:0 9px 26px rgba(0,0,0,.28)}.card.paused{border-color:var(--orange)}.hint{color:var(--yellow);font-size:18px;font-weight:800;margin-bottom:10px}.jp{font-size:29px;font-weight:800;line-height:1.35;padding:10px 14px;border-radius:12px;transition:.15s}.jp.active-main{background:#0b3b52;outline:3px solid var(--blue);box-shadow:0 0 18px rgba(56,189,248,.35)}.kana{color:#93c5fd;font-size:18px;margin-top:8px}.romaji{color:var(--red);font-size:17px;margin-top:5px}.zh{color:var(--green);font-size:18px;margin-top:5px}.progress{height:11px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:18px}.bar{height:100%;width:0;background:var(--blue)}.meta{text-align:center;color:var(--muted);font-size:14px;margin:9px 0}.list{height:440px;overflow:auto;background:var(--list);border-radius:16px;padding:10px;scroll-behavior:smooth}.row{padding:12px;border-bottom:1px solid #1e293b;border-radius:11px;cursor:pointer}.row.active{background:#334155;outline:3px solid var(--blue);box-shadow:0 0 18px rgba(56,189,248,.3)}.row b{font-size:17px}.small{font-size:13px;color:var(--muted);line-height:1.45}.small.zh2{color:var(--green)}@media(max-width:640px){body{padding:9px}.jp{font-size:23px}.list{height:400px}.controls button,.controls select{padding:9px 10px}}
</style></head>
<body><div class="wrap"><h1>🎧 にじ｜Shadowing 全曲版</h1>
<div class="controls"><button onclick="unlockAudio()">🔓 解鎖音訊</button><button onclick="playAll()">▶ 全曲播放</button><button class="alt" id="pauseBtn" onclick="togglePause()">⏸ 暫停</button><button class="stop" onclick="stopAll()">⏹ 停止</button><select id="rate" onchange="audio.playbackRate=Number(this.value)"><option value="0.85">0.85× Shadowing</option><option value="1" selected>1.00× 正常</option></select></div>
<div class="card" id="card"><div class="hint" id="hint">請先解鎖音訊</div><div class="jp" id="jp">準備開始</div><div class="kana" id="kana"></div><div class="romaji" id="romaji"></div><div class="zh" id="zh"></div><div class="progress"><div class="bar" id="bar"></div></div></div>
<div class="meta" id="meta">完整音軌連續播放，字幕依 audio.currentTime 同步</div><div class="list" id="list"></div></div>
<script>
const audio=new Audio("input.mp3");audio.preload="auto";audio.setAttribute("playsinline","");let rows=[],active=-1,raf=0,data=[];
async function load(){const r=await fetch("song.json?v="+Date.now());data=await r.json();list.innerHTML=data.map((d,i)=>`<div class="row" id="row-${i}" onclick="jump(${i})"><b>${String(i+1).padStart(2,"0")}. ${esc(d.text)}</b><div class="small">${esc(d.kana)}</div><div class="small">${esc(d.romaji)}</div><div class="small zh2">${esc(d.zh)}</div></div>`).join("");rows=[...document.querySelectorAll(".row")]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function indexAt(t){let lo=0,hi=data.length-1,ans=-1;while(lo<=hi){const m=(lo+hi)>>1;if(t>=data[m].start){ans=m;lo=m+1}else hi=m-1}return ans>=0&&t<=data[ans].end?ans:-1}
function activate(i){if(i===active)return;if(active>=0)rows[active].classList.remove("active");active=i;if(i<0){hint.textContent="間奏 / 前奏";jp.classList.remove("active-main");return}const d=data[i];rows[i].classList.add("active");requestAnimationFrame(()=>rows[i].scrollIntoView({behavior:"smooth",block:"center"}));jp.textContent=d.text;jp.classList.add("active-main");kana.textContent=d.kana;romaji.textContent=d.romaji;zh.textContent=d.zh;hint.textContent=`🎧 第 ${String(i+1).padStart(2,"0")} 句`}
function tick(){const t=audio.currentTime;activate(indexAt(t));bar.style.width=(audio.duration?Math.min(100,t/audio.duration*100):0)+"%";meta.textContent=`${fmt(t)} / ${fmt(audio.duration||0)}｜${audio.playbackRate.toFixed(2)}×`;if(!audio.paused)raf=requestAnimationFrame(tick)}
function fmt(s){if(!isFinite(s))return"00:00.00";const m=Math.floor(s/60);const x=(s%60).toFixed(2).padStart(5,"0");return`${String(m).padStart(2,"0")}:${x}`}
async function unlockAudio(){try{await audio.play();audio.pause();audio.currentTime=0;hint.textContent="音訊已解鎖，可以開始"}catch(e){alert("請再點一次解鎖音訊")}}
async function playAll(){audio.playbackRate=Number(rate.value);if(audio.currentTime>=audio.duration-.2)audio.currentTime=0;await audio.play();card.classList.remove("paused");pauseBtn.textContent="⏸ 暫停";cancelAnimationFrame(raf);tick()}
function togglePause(){if(audio.paused){audio.play().then(()=>{card.classList.remove("paused");pauseBtn.textContent="⏸ 暫停";tick()})}else{audio.pause();card.classList.add("paused");pauseBtn.textContent="▶ 繼續";cancelAnimationFrame(raf)}}
function stopAll(){audio.pause();audio.currentTime=0;cancelAnimationFrame(raf);bar.style.width="0%";activate(-1);pauseBtn.textContent="⏸ 暫停";card.classList.remove("paused");jp.textContent="準備開始";jp.classList.remove("active-main");kana.textContent="";romaji.textContent="";zh.textContent=""}
function jump(i){audio.currentTime=data[i].start;audio.playbackRate=Number(rate.value);audio.play().then(()=>{card.classList.remove("paused");pauseBtn.textContent="⏸ 暫停";tick()})}
audio.addEventListener("ended",()=>{cancelAnimationFrame(raf);jp.classList.remove("active-main");hint.textContent="✅ 全曲播放完成";pauseBtn.textContent="⏸ 暫停"});load();
</script></body></html>
